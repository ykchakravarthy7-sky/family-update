name: Save approved reveal artwork
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/save-final-artwork.yml
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved artwork
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --output assets/final-invitation.png 'https://at.adobe.com/caihnTIoclKyQBtY'
          file assets/final-invitation.png | grep -q 'PNG image data'
      - name: Commit artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/final-invitation.png
          git diff --cached --quiet || (git commit -m 'Save approved final invitation artwork' && git push)
